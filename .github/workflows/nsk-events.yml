name: nsk-events

on:
  schedule:
    - cron: "7 1 * * *"   # 08:07 Новосибирск (UTC+7): дайджест на сегодня и завтра
    - cron: "7 8 * * *"   # 15:07 Новосибирск: сегодняшний вечер
  workflow_dispatch:       # ручной запуск кнопкой

permissions:
  contents: write          # нужно только для keepalive-коммита ниже

concurrency:
  group: nsk-events

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Запуск агента
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MODE: ${{ github.event.schedule == '7 8 * * *' && 'evening' || 'morning' }}
        run: python bot.py

      # GitHub отключает расписание в публичном репозитории после 60 дней без активности.
      # Если последний коммит старше 45 дней - делаем пустой коммит.
      - name: Keepalive
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt $((45*86400)) ]; then
            git config user.name "keepalive-bot"
            git config user.email "keepalive-bot@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
